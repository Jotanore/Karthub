<div>
  @if (layout(); as currentLayout) {
  <app-editor-toolbar [activeTool]="selectedTool()" (toolSelected)="toolUpdate($event)" />
  <p>Layout: {{ currentLayout.name }}</p>
  <app-svg-editor [layout]="currentLayout" [points]="points()" [activeTool]="selectedTool()"
    [selectedPointId]="selectedPointId()" (pointCreated)="onPointCreated($event)" />
  } @else {
  <p>Layout not found</p>
  }
</div>
